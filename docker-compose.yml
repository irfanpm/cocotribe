services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: koko
      POSTGRES_PASSWORD: koko_local_only
      POSTGRES_DB: koko
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - koko_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koko"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  koko_data:

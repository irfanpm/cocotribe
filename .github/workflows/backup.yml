# Nightly encrypted database backup, for Supabase plans without automatic backups.
# Needs repository secrets BACKUP_DATABASE_URL (the session pooler / DIRECT_URL value) and
# BACKUP_PASSPHRASE. Dumps contain customer data, so they are encrypted before upload.
# Restore: gpg -d backup.sql.gz.gpg | gunzip | psql "$TARGET_DATABASE_URL"
name: Database backup
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges --schema=public "$BACKUP_DATABASE_URL" \
            | gzip \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: cocotribe-db-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
